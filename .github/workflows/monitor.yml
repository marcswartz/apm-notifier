name: APM Notifier

on:
  schedule:
    # Hourly backup; Cloudflare dispatches the primary check every five minutes.
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a Telegram test message during this run
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apm-notifier
  cancel-in-progress: false

jobs:
  check-career-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_PATH: ${{ github.workspace }}/data/notifier.sqlite3
      SOURCES_PATH: ${{ github.workspace }}/config/sources.json
      CHECK_INTERVAL_SECONDS: "300"
      REQUEST_TIMEOUT_SECONDS: "25"
      REQUEST_CONCURRENCY: "8"
      TARGET_YEAR: "2027"
      EXCLUDED_YEARS: "2020,2021,2022,2023,2024,2025,2026"
      ALLOWED_COUNTRIES: "US,CA,UK"
      # A lost or first-time cache establishes a quiet baseline instead of
      # sending every role that is already live.
      ALERT_ON_FIRST_RUN: "false"

    steps:
      - name: Check out notifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore notification history
        id: restore-state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data
          key: apm-notifier-state-${{ github.run_id }}
          restore-keys: |
            apm-notifier-state-

      - name: Validate cloud configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Required Telegram secrets are not configured."
            exit 1
          fi
          mkdir -p data
          python3 --version
          google-chrome --version

      - name: Check career pages and deliver new alerts
        run: python3 -m apm_notifier run --once

      - name: Send requested cloud test notification
        if: ${{ inputs.send_test_notification }}
        run: python3 -m apm_notifier test-notification

      - name: Save notification history
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data
          key: apm-notifier-state-${{ github.run_id }}
