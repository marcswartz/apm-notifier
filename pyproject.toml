[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apm-notifier"
version = "0.1.0"
description = "Instant alerts for APM, product manager intern, and product marketing intern openings"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
apm-notifier = "apm_notifier.cli:main"

[tool.setuptools.packages.find]
include = ["apm_notifier*"]
